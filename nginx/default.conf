upstream api {
    server 127.0.0.1:3000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# НЕ жать то, что уже сжато
map $sent_http_content_type $skip_gzip {
    default                      0;
    "application/gzip"           1;
    "application/x-gzip"         1;
    "application/zip"            1;
}

server {
    listen 8080 default_server;
    server_name _;

    root /app/public;
    index index.html;

    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    client_max_body_size  20m;
    client_body_timeout   30s;
    client_header_timeout 15s;

    # --- сжатие ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        image/svg+xml;

    # --- security headers ---
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "geolocation=(), microphone=()"    always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # после TLS

    # --- страницы ошибок ---
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>503</title><h1>Сервис временно недоступен</h1><p>Попробуйте через минуту.</p>';
    }

    # --- статика ---
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- ассеты ---
    location ~* \.(css|js|png|jpg|jpeg|svg|gif|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # уже сжатые — не гоняем через gzip
    location ~* \.(gz|br|zip|7z|rar)$ {
        gzip off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- служебные мелочи, не засоряем лог ---
    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =204; }

    # --- main.html от соседа: отдаём как обычную статику ---
    location = /main.html {
        try_files $uri =404;
    }

    # --- метрики закрыты для внешнего мира ---
    location = /metrics {
        deny all;
        return 404;
    }

    # --- API (общий rate-limit) ---
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;

        # буферы — Node быстрее освобождает соединение
        proxy_buffering        on;
        proxy_buffer_size      8k;
        proxy_buffers          8 8k;
        proxy_busy_buffers_size 16k;
    }

    # --- auth (усиленный rate-limit, перекрывает /api/) ---
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # --- health ---
    location = /health {
        proxy_pass http://api;
        access_log off;
    }

    # --- служебное скрыто ---
    location ~ /\.(?!well-known) {
        deny all;
    }
}