upstream api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# rate-limit на /api/auth/*: 5 запросов в минуту с одного IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /app/public;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    client_max_body_size 20m;
    client_body_timeout  30s;
    client_header_timeout 15s;

    # --- сжатие ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        image/svg+xml;

    # --- security headers ---
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "geolocation=(), microphone=()"    always;
    # HSTS — после включения валидного TLS.

    # --- статика ---
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- ассеты, долгий кеш ---
    location ~* \.(css|js|png|jpg|jpeg|svg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- API ---
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
    }

    # --- rate-limit на auth (объявлен после /api/, чтобы перекрывал его) ---
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # --- health (для HEALTHCHECK) ---
    location = /health {
        proxy_pass http://api;
        access_log off;
    }

    # --- не отдаём скрытое ---
    location ~ /\.(?!well-known) {
        deny all;
    }
}