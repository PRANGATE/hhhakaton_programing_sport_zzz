<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ФСП · Платформа ИТ-вакансий — подтверждение</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/email_code_styles.css" />
</head>
<body>
    <img src="logos/logo_01.svg">
    <div class="email-title">Подтвердите email</div>
    <div class="email-information-container">
        <div>от: emailfiller@scam.com</div>
        <div class="pin-container">
            <input maxlength="1" inputmode="numeric" class="pin-cell">
            <input maxlength="1" inputmode="numeric" class="pin-cell">
            <input maxlength="1" inputmode="numeric" class="pin-cell">
            <input maxlength="1" inputmode="numeric" class="pin-cell">
            <input maxlength="1" inputmode="numeric" class="pin-cell">
            <input maxlength="1" inputmode="numeric" class="pin-cell">
        </div>
        <div class="code-lifetime">код действует 10 минут с момента отправки</div>
    </div>
    <div class="buttons-container">
        <button class="submit-b">подтвердить и войти</button>
        <button class="resend-b">отправить снова</button>
    </div>

<script>
document.querySelectorAll('.pin-cell').forEach((cell, index, cells) => {
    cell.addEventListener('input', () => {
        if (cell.value && index < cells.length - 1) {
            cells[index + 1].focus();
        }
    });
    
    cell.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !cell.value && index > 0) {
            cells[index - 1].focus();
        }
    });
});

// Автофокус
document.querySelector('.pin-cell').focus();
</script>
</body>
