<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ФСП / talent — макеты 16 экранов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bl:#402FFF;--rd:#EC1D35;--ink:#1B1C21;--bg:#EDEDED;--br:#C8C9CA;--w:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.55;overflow:hidden}
::selection{background:var(--bl);color:#fff}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
/* ===== topbar (light, 12-col grid: logo 2 / meta 8 / counter 2) ===== */
.top{position:fixed;top:0;left:0;right:0;height:48px;z-index:60;display:grid;grid-template-columns:repeat(12,1fr);align-items:center;gap:12px;padding:0 20px;background:var(--w);border-bottom:1px solid var(--br)}
.tlogo{grid-column:span 3;display:flex;align-items:center;gap:9px}
.tlogo b{font-size:13px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.tlogo b span{color:var(--bl)}
.tmeta{grid-column:span 7;font-size:10.5px;color:var(--ink);opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tright{grid-column:span 2;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.tbtn{border:1px solid var(--ink);padding:4px 10px;font-size:10.5px;font-weight:700}
.tbtn:hover{background:var(--ink);color:#fff}
.tcnt{font-size:11px;font-weight:800;color:var(--bl);white-space:nowrap}
.pbar{position:fixed;top:48px;left:0;height:2px;background:var(--bl);z-index:61;width:0;transition:width .25s}
/* ===== stage ===== */
.viewport{position:fixed;inset:50px 0 50px;display:flex;align-items:center;justify-content:center}
.stage{width:1280px;height:716px;flex:none;position:relative;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--w);border:1px solid var(--ink);display:none;flex-direction:column;padding:24px 30px 14px;overflow:hidden}
.slide.on{display:flex;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bigno{position:absolute;top:-30px;right:16px;font-size:170px;font-weight:800;line-height:1;color:var(--bg);user-select:none;pointer-events:none;z-index:0}
/* ===== slide head / body / foot (12-col) ===== */
.s-head{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-items:start;margin-bottom:14px;position:relative;z-index:2}
.s-no{grid-column:span 2;font-size:30px;font-weight:800;color:var(--bl);line-height:1.05}
.s-no span{display:block;font-size:10px;color:var(--ink);opacity:.6;font-weight:500}
.s-tt{grid-column:span 7}
.s-tt h2{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.s-sub{font-size:10.5px;color:var(--ink);opacity:.62;margin-top:3px}
.s-w{grid-column:span 3;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.wc{font-size:10px;font-weight:800;padding:3px 10px;white-space:nowrap}
.wc.r{background:var(--rd);color:#fff}
.wc.b{background:var(--bl);color:#fff}
.wc.o{border:1px solid var(--bl);color:var(--bl)}
.s-body{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:16px;min-height:0;position:relative;z-index:2}
.mock{grid-column:span 8;border:1px solid var(--br);display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--w)}
.spec{grid-column:span 4;background:var(--bg);border:1px solid var(--br);padding:14px 16px;display:flex;flex-direction:column;min-height:0}
.s-foot{margin-top:10px;display:flex;justify-content:space-between;gap:12px;font-size:9.5px;color:var(--ink);opacity:.55;position:relative;z-index:2}
/* ===== spec panel ===== */
.spec-h{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
.spec-h b{color:var(--bl);opacity:1}
.spec ul{list-style:none;flex:1;overflow:auto;min-height:0}
.spec li{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--br);font-size:10.5px;line-height:1.5}
.spec li:last-child{border:0}
.spec li b{font-weight:500}
.ref{font-size:8.5px;font-weight:700;color:var(--bl);border:1px solid var(--bl);padding:0 5px;white-space:nowrap;flex:none}
.spec-n{margin-top:10px;padding:9px 12px;border-left:3px solid var(--bl);background:var(--w);font-size:10px;line-height:1.6}
.spec-n b{color:var(--rd)}
/* ===== mock frame ===== */
.mk-top{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--br);background:var(--bg);flex:none}
.mk-logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:10.5px;white-space:nowrap}
.mk-logo span{color:var(--bl)}
.mk-tabs{display:flex;gap:2px;overflow:hidden}
.mk-tab{font-size:9.5px;padding:3px 8px;color:var(--ink);opacity:.55;white-space:nowrap}
.mk-tab.on{opacity:1;background:var(--ink);color:#fff}
.mk-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.mk-body{flex:1;padding:14px 16px;min-height:0;display:flex;gap:16px;overflow:hidden}
.mk-body.col{flex-direction:column}.mk-body.center{align-items:center;justify-content:center}.mk-body.p0{padding:0}
.mfoot2{flex:none;border-top:1px solid var(--br);padding:7px 12px;font-size:9px;opacity:.62}
/* ===== mock atoms ===== */
.m-l{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-bottom:4px}
.mk-in{border:1px solid var(--br);background:var(--w);padding:6px 10px;font-size:10.5px;color:var(--ink);opacity:.45;min-height:29px;display:flex;align-items:center}
.mk-in.ink{opacity:1}
.mk-in.err{border-color:var(--rd);color:var(--rd);opacity:1}
.mk-b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);padding:6px 13px;font-size:10.5px;font-weight:700;white-space:nowrap;background:var(--w)}
.mk-b:hover{background:var(--ink);color:#fff}
.mk-b.pri{background:var(--bl);border-color:var(--bl);color:#fff}
.mk-b.pri:hover{background:#2E1FD0}
.mk-b.cta{background:var(--rd);border-color:var(--rd);color:#fff}
.mk-b.cta:hover{background:#C81528}
.mk-b.dis{border:1px dashed var(--br);color:var(--br);background:transparent;pointer-events:none}
.mk-b.sm{padding:4px 9px;font-size:9.5px}
.mk-t{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--br);padding:2px 8px;font-size:9px;font-weight:500;white-space:nowrap;background:var(--w)}
.mk-t.p{border-color:var(--bl);color:var(--bl)}
.mk-t.k{background:var(--ink);border-color:var(--ink);color:#fff}
.mk-t.bp{background:var(--bl);border-color:var(--bl);color:#fff}
.mk-t.r{border-color:var(--rd);color:var(--rd)}
.mk-t.wr{background:var(--rd);border-color:var(--rd);color:#fff;font-weight:800}
.mk-t.wb{background:var(--bl);border-color:var(--bl);color:#fff;font-weight:800}
.st{display:inline-block;font-size:8.5px;font-weight:700;padding:2px 8px;border:1px solid var(--br);color:var(--ink);opacity:.7;white-space:nowrap}
.st.v{border-color:var(--bl);color:var(--bl);opacity:1}
.st.a{background:var(--bl);border-color:var(--bl);color:#fff;opacity:1}
.st.d{background:var(--rd);border-color:var(--rd);color:#fff;opacity:1}
.mk-ch{display:inline-flex;align-items:center;border:1px solid var(--br);background:var(--bg);padding:2px 8px;font-size:9.5px;white-space:nowrap}
.mk-ch.hit{background:var(--bl);border-color:var(--bl);color:#fff;font-weight:700}
.mk-ch.add{border-style:dashed;color:var(--br)}
.mk-bar{height:5px;background:var(--bg);border:1px solid var(--br);display:inline-block;min-width:36px}
.mk-bar i{display:block;height:100%;background:var(--bl)}
.mk-bar.rd i{background:var(--rd)}
.mk-sw{width:30px;height:16px;background:var(--br);position:relative;display:inline-block;flex:none}
.mk-sw i{position:absolute;top:2px;left:2px;width:12px;height:12px;background:#fff}
.mk-sw.on{background:var(--bl)}
.mk-sw.on i{left:auto;right:2px}
.mk-sw.dis{opacity:.4}
.mk-cb{width:14px;height:14px;border:1px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex:none}
.mk-cb.on{background:var(--bl);border-color:var(--bl);color:#fff}
.mk-an{font-size:9.5px;line-height:1.7;opacity:.62}
.mk-an b{color:var(--bl);opacity:1;font-weight:700}
.mk-an .rd{color:var(--rd);opacity:1;font-weight:700}
.mh2{font-size:15px;font-weight:800}
.mform{display:flex;flex-direction:column;gap:9px;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pick{border:1px solid var(--br);padding:6px 9px;font-size:9.5px;opacity:.6;font-weight:500;background:var(--w)}
.pick.on{border:1.5px solid var(--bl);color:var(--bl);opacity:1;font-weight:700;background:var(--bg)}
.mrole{border:1px solid var(--br);padding:8px 11px;font-size:9px;opacity:.6;flex:1}
.mrole b{display:block;font-size:10.5px;font-weight:700}
.mrole.on{border:1.5px solid var(--bl);opacity:1}
.mrole.on b{color:var(--bl)}
.mk-code{background:var(--ink);color:#E6E6E8;padding:11px 14px;font-size:9.5px;line-height:1.75;white-space:pre;overflow:hidden}
.mk-code .kw{color:#9C90FF}.mk-code .nu{color:#8CD9A8}.mk-code .ln{color:#5B5C64;margin-right:10px;user-select:none}
.mk-stamp{display:inline-block;border:3px solid var(--bl);color:var(--bl);padding:7px 18px;font-weight:800;font-size:19px;letter-spacing:.04em;transform:rotate(-2deg);background:var(--w)}
.mk-stamp.bad{border-color:var(--rd);color:var(--rd)}
.mk-tbl{width:100%;border-collapse:collapse;font-size:9.5px}
.mk-tbl th{text-align:left;font-size:8px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;font-weight:700;padding:4px 8px;border-bottom:1.5px solid var(--ink)}
.mk-tbl td{padding:6px 8px;border-bottom:1px solid var(--br);vertical-align:middle}
.mk-tbl tr:last-child td{border:0}
.lrow{display:flex;align-items:center;gap:12px;border:1px solid var(--br);background:var(--w);padding:8px 12px}
.lrow.sel{border:1.5px solid var(--bl)}
.trk{display:flex;align-items:center;margin:6px 0}
.trk .tp{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:70px}
.trk .dot{width:9px;height:9px;border:2px solid var(--br);background:#fff}
.trk .tp.done .dot{background:var(--bl);border-color:var(--bl)}
.trk .tl{flex:1;height:2px;background:var(--br)}
.trk .tl.done{background:var(--bl)}
.trk .tp span{font-size:7.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
/* ===== cover ===== */
.cover{justify-content:center;background:var(--w)}
.cv-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;flex:1;align-items:center;position:relative;z-index:2}
.cv-l{grid-column:span 8}
.cv-r{grid-column:span 4;display:flex;flex-direction:column;gap:16px;align-items:flex-end}
.cv-lock{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.cv-lock .lk{font-size:11px;font-weight:700;line-height:1.35;text-align:left}
.cv-kick{font-size:10px;font-weight:800;letter-spacing:.22em;color:var(--bl);text-transform:uppercase;margin-bottom:12px}
.cover h1{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1.06}
.cover h1 em{font-style:normal;color:var(--bl)}
.cv-lead{max-width:600px;font-size:13px;line-height:1.75;margin-top:18px;opacity:.75}
.cv-lead b{opacity:1;font-weight:700}
.cv-lead .rd{color:var(--rd);opacity:1;font-weight:700}
.cv-chips{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.cv-chips .mk-t{font-size:10px;padding:5px 11px}
.cv-map{opacity:.9}
.cv-keys{position:absolute;bottom:16px;left:30px;right:30px;display:flex;justify-content:space-between;font-size:9.5px;opacity:.55;z-index:2}
.cv-keys b{border:1px solid var(--br);padding:0 6px;font-weight:700}
/* ===== map slide ===== */
.map-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px;min-height:0;position:relative;z-index:2}
.map-it{border:1px solid var(--br);background:var(--w);padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left;min-height:0;position:relative}
.map-it:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.mi-no{font-size:18px;font-weight:800;color:var(--bl)}
.map-it:hover .mi-no{color:#fff}
.mi-t{font-size:10.5px;font-weight:700;line-height:1.35;flex:1}
.mi-r{font-size:8.5px;opacity:.55}
.mi-w{position:absolute;top:9px;right:9px;font-size:8px;font-weight:800;padding:1px 6px}
.mi-w.r{background:var(--rd);color:#fff}.mi-w.b{background:var(--bl);color:#fff}
/* ===== flow ===== */
.flow-wrap{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;position:relative;z-index:2}
.flane{display:flex;align-items:stretch}
.flab{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;font-weight:800;letter-spacing:.14em;color:var(--bl);text-transform:uppercase;border-right:2px solid var(--bl);padding-left:8px;margin-right:12px;flex:none;display:flex;align-items:center}
.fstep{flex:1;border:1px solid var(--ink);background:var(--w);padding:9px 11px;font-size:10px;font-weight:700;min-width:0}
.fstep small{display:block;font-size:8.5px;opacity:.55;font-weight:500;margin-top:2px;line-height:1.4}
.farr{display:flex;align-items:center;padding:0 5px;color:var(--bl);font-weight:800;flex:none}
.fstep.hl{border-color:var(--bl);background:var(--bg)}
.fstep.rd{border-color:var(--rd);background:var(--rd);color:#fff}
.fstep.rd small{color:#fff;opacity:.8}
.fstep.bl{border-color:var(--bl);background:var(--bl);color:#fff}
.fstep.bl small{color:#fff;opacity:.8}
.fq{border:1.5px dashed var(--rd);color:var(--rd)}
.fnote{border:1px solid var(--br);background:var(--bg);padding:10px 14px;font-size:10px;line-height:1.7}
.fnote b{color:var(--bl)}
.fnote .rd{color:var(--rd);font-weight:700}
/* ===== navbar (dark 25%) & menu ===== */
.navbar{position:fixed;bottom:0;left:0;right:0;height:50px;z-index:60;background:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.nbtn{width:40px;height:32px;border:1px solid #fff;color:#fff;font-weight:800;font-size:14px}
.nbtn:hover{background:var(--bl);border-color:var(--bl)}
.nmenu{border:1px solid #fff;color:#fff;padding:7px 16px;font-size:10.5px;font-weight:800;letter-spacing:.1em}
.nmenu:hover{background:var(--bl);border-color:var(--bl)}
.nhint{position:absolute;right:18px;font-size:9.5px;color:#fff;opacity:.5}
.nhint b{border:1px solid var(--br);padding:0 5px;font-weight:700}
#menu{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;padding:58px 40px 24px}
#menu.open{display:flex}
#menu .m-close{position:absolute;top:14px;right:18px;border:1px solid var(--ink);padding:5px 13px;font-weight:800;font-size:12px;background:var(--w)}
#menu .m-close:hover{background:var(--rd);border-color:var(--rd);color:#fff}
#menu h3{font-size:13px;font-weight:800;margin-bottom:12px}
@media (max-width:640px){.tmeta,.nhint{display:none}.tlogo{grid-column:span 6}.tmeta{display:none}.tright{grid-column:span 6}}
</style>
</head>
<body>

<div class="pbar" id="pbar"></div>
<header class="top">
  <div class="tlogo" id="tlogo"></div>
  <div class="tmeta">// презентация макетов · платформа-агрегатор ИТ-вакансий с верификацией ФСП · 16 обязательных экранов ТЗ</div>
  <div class="tright"><button class="tbtn" id="btnMenuT">Все слайды</button><span class="tcnt" id="cnt">01 / 19</span></div>
</header>

<main class="viewport"><div class="stage" id="stage"></div></main>

<nav class="navbar" aria-label="Навигация по слайдам">
  <button class="nbtn" id="bPrev" aria-label="Предыдущий слайд">←</button>
  <button class="nmenu" id="bMenu">ВСЕ СЛАЙДЫ</button>
  <button class="nbtn" id="bNext" aria-label="Следующий слайд">→</button>
  <span class="nhint"><b>←</b> <b>→</b> листать · <b>M</b> меню · <b>Home/End</b> края</span>
</nav>

<div id="menu" role="dialog" aria-modal="true" aria-label="Содержание"><button class="m-close" id="mClose">ЗАКРЫТЬ ✕</button><h3>// СОДЕРЖАНИЕ · 19 СЛАЙДОВ</h3><div class="map-grid" id="mGrid"></div></div>

<script>
'use strict';
/* ================= бренд-ассеты ФСП =================
   Знак: звезда-молекула (5 внешних узлов + внутреннее сплетение).
   Не перекрашивается: тёмный на светлом, белый на тёмном. Охранное поле — паддинги. */
const STAR=(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" role="img" aria-label="Логотип ФСП" style="flex:none;padding:${Math.round(s*.12)}px">
<g stroke="${c}" stroke-width="3.2" stroke-linecap="round" fill="none">
<path d="M32 2 L49.6 56.3 L3.5 22.7 L60.5 22.7 L14.4 56.3 Z"/></g>
<g fill="${c}">
<circle cx="32" cy="2" r="5"/><circle cx="60.5" cy="22.7" r="5"/><circle cx="49.6" cy="56.3" r="5"/><circle cx="14.4" cy="56.3" r="5"/><circle cx="3.5" cy="22.7" r="5"/>
<circle cx="38.7" cy="22.7" r="2.6"/><circle cx="42.9" cy="35.5" r="2.6"/><circle cx="32" cy="43.5" r="2.6"/><circle cx="21.1" cy="35.5" r="2.6"/><circle cx="25.3" cy="22.7" r="2.6"/></g></svg>`;
const LOGO_D=STAR(26,'#1B1C21'), LOGO_W=STAR(22,'#FFFFFF');
const WIRE=`<svg viewBox="0 0 260 120" width="230" aria-hidden="true"><path d="M6 20 H150 Q162 20 162 32 V78 Q162 90 174 90 H254" stroke="#402FFF" stroke-width="1.5" fill="none"/><circle cx="6" cy="20" r="3.5" fill="#402FFF"/><circle cx="254" cy="90" r="3.5" fill="#402FFF"/></svg>`;
const RUS=`<svg viewBox="0 0 240 120" width="210" role="img" aria-label="Карта России" class="cv-map"><path fill="#402FFF" d="M10 56 L22 42 L28 50 L44 38 L58 28 L66 34 L88 22 L112 16 L136 22 L158 18 L182 24 L206 28 L220 34 L212 42 L220 50 L204 54 L196 48 L190 62 L182 54 L176 66 L166 58 L154 62 L140 56 L126 60 L112 54 L98 58 L84 54 L70 56 L56 50 L44 54 L32 50 L22 54 Z"/></svg>`;
/* ================= helpers ================= */
const L=t=>`<div class="m-l">${t}</div>`;
const IN=(v,c='')=>`<div class="mk-in ${c}">${v}</div>`;
const F=(t,v,c='')=>`<div>${L(t)}${IN(v,c)}</div>`;
const B=(t,c='')=>`<span class="mk-b ${c}">${t}</span>`;
const T=(t,c='')=>`<span class="mk-t ${c}">${t}</span>`;
const CH=(t,c='')=>`<span class="mk-ch ${c}">${t}</span>`;
const BAR=(v,rd='')=>`<span class="mk-bar ${rd}" style="width:86px"><i style="width:${v}%"></i></span>`;
const SW=(on,d)=>`<span class="mk-sw ${on?'on':''} ${d?'dis':''}"><i></i></span>`;
const CBX=on=>`<span class="mk-cb ${on?'on':''}">${on?'✓':''}</span>`;
const ST=s=>({s:'<span class="st">отправлено</span>',v:'<span class="st v">просмотрено</span>',a:'<span class="st a">принято</span>',d:'<span class="st d">отклонено</span>'}[s]);
const A=t=>`<div class="mk-an"><b>//</b> ${t}</div>`;

<div class="fnote"><b>// для демо:</b> отдельно показать механику тестирования (пул заданий, таймер, автокатегория — <b>25%</b>) и подбора («почему в подборке», ранжирование тест ↓ затем ФСП — <b>35%</b>); статусная модель приглашений едина для обеих сторон; раскрытие контактов — только при «принято».</div>
</div></div>`;

/* ================= рендер колоды ================= */
const SLIDES=[cover,mapSlide,...SCR.map(scrSlide),flowSlide];
const stage=document.getElementById('stage');
stage.innerHTML=SLIDES.map(s=>s).join('');
const els=[...stage.children];
let idx=0;
function show(i){
 idx=Math.max(0,Math.min(SLIDES.length-1,i));
 els.forEach((el,j)=>el.classList.toggle('on',j===idx));
 document.getElementById('cnt').textContent=String(idx+1).padStart(2,'0')+' / '+SLIDES.length;
 document.getElementById('pbar').style.width=((idx+1)/SLIDES.length*100)+'%';
 history.replaceState(null,'','#s'+(idx+1));
}
function fit(){
 const vw=innerWidth-32,vh=innerHeight-104;
 const k=Math.min(vw/1280,vh/716,1);
 stage.style.transform='scale('+k+')';
}
addEventListener('resize',fit);
/* меню */
const mGrid=document.getElementById('mGrid');
mGrid.innerHTML=`<button class="map-it" data-go="0"><span class="mi-no">00</span><span class="mi-t">Обложка</span><span class="mi-r">· титул</span></button>
<button class="map-it" data-go="1"><span class="mi-no">··</span><span class="mi-t">Карта экранов</span><span class="mi-r">· навигация</span></button>
 ${SCR.map((s,i)=>`<button class="map-it" data-go="${i+2}"><span class="mi-no">${String(s.no).padStart(2,'0')}</span><span class="mi-t">${s.t}</span><span class="mi-r">· ${ROLE[s.r]}</span>${s.w?`<span class="mi-w ${s.w===35?'r':'b'}">${s.w}%</span>`:''}</button>`).join('')}
<button class="map-it" data-go="${SLIDES.length-1}"><span class="mi-no">§</span><span class="mi-t">Сквозной сценарий</span><span class="mi-r">· п.3.3</span></button>`;
const menu=document.getElementById('menu');
const toggleMenu=f=>menu.classList.toggle('open',f===undefined?undefined:f);
document.getElementById('bMenu').onclick=()=>toggleMenu(true);
document.getElementById('btnMenuT').onclick=()=>toggleMenu(true);
document.getElementById('mClose').onclick=()=>toggleMenu(false);
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');
 if(g){toggleMenu(false);show(+g.dataset.go);}
});
/* навигация */
document.getElementById('bNext').onclick=()=>show(idx+1);
document.getElementById('bPrev').onclick=()=>show(idx-1);
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key==='PageDown')show(idx+1);
 else if(e.key==='ArrowLeft'||e.key==='PageUp')show(idx-1);
 else if(e.key==='Home')show(0);
 else if(e.key==='End')show(SLIDES.length-1);
 else if(e.key==='m'||e.key==='M'||e.key==='ь'||e.key==='Ь')toggleMenu();
 else if(e.key==='Escape')toggleMenu(false);
});
/* шапка: логотип + локап */
document.getElementById('tlogo').innerHTML=LOGO_D+'<b>ФСП<span>/talent</span></b>';
/* старт: поддержка deep-link #sN */
const m=location.hash.match(/^#s(\d+)$/);
show(m?+m[1]-1:0);
fit();
</script>
