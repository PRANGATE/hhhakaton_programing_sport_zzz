<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ФСП · Профиль компании</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/employer/employer.css" />
  <link rel="stylesheet" href="/navigation_bar_styles.css" />
  <script src="/navigation_bar_script.js"></script>
</head>

<body data-navbar-state="employer">

  <main class="emp-main">
    <div class="emp-head">
      <div>
        <h1>Профиль компании</h1>
        <p>Эти данные подставляются в каждое приглашение кандидату.</p>
      </div>
    </div>

    <form id="profile-form">
      <div class="card">
        <div class="row2">
          <div class="field"><label>Название *</label><input name="company_name" required maxlength="200" /></div>
          <div class="field"><label>Направление деятельности</label>
            <select name="industry_id">
              <option value="">— не выбрано —</option>
              <option value="fintech">Финтех</option>
              <option value="ecom">E-commerce</option>
              <option value="gov">Госсектор</option>
              <option value="medtech">Медтех</option>
              <option value="telecom">Телеком</option>
              <option value="logistics">Логистика</option>
              <option value="gamedev">GameDev</option>
              <option value="other">Другое</option>
            </select>
          </div>
        </div>
        <div class="row2" style="margin-top:14px">
          <div class="field"><label>Контактное лицо</label><input name="contact_person" /></div>
          <div class="field"><label>Email для связи</label><input type="email" name="contact_email" /></div>
        </div>
        <div class="row2" style="margin-top:14px">
          <div class="field"><label>Telegram</label><input name="contact_telegram" placeholder="@username" /></div>
          <div class="field"><label>Телефон</label><input name="contact_phone" /></div>
        </div>
        <div class="field" style="margin-top:14px">
          <label>Способ связи по умолчанию</label>
          <select name="default_channel">
            <option value="telegram">Telegram</option>
            <option value="email">Email</option>
            <option value="phone">Телефон</option>
          </select>
        </div>
        <div class="field" style="margin-top:14px">
          <label>Описание организации</label>
          <textarea name="description" maxlength="4000"
            placeholder="Чем занимается компания, стек, культура, формат работы…"></textarea>
        </div>
      </div>

      <div style="display:flex; gap:12px; align-items:center">
        <button type="submit" class="btn btn--primary">Сохранить</button>
        <a href="/employer/needs.html" class="btn btn--ghost">Далее: описать потребность →</a>
        <span id="save-status" style="color:var(--muted); font-size:13px"></span>
      </div>
    </form>
  </main>
  <footer class="site-footer">
    <p><small>ФСП · Платформа ИТ-вакансий</small></p>
  </footer>
  <script type="module">
    import { mountShell, api, readForm } from '/employer/employer.js';

    const user = await mountShell('profile');
    if (!user) throw new Error('auth');

    const form = document.getElementById('profile-form');
    const statusEl = document.getElementById('save-status');

    async function load() {
      try {
        const { profile } = await api('/profile/me');
        if (profile) {
          for (const [k, v] of Object.entries(profile)) {
            const el = form.elements.namedItem(k);
            if (el && v != null) el.value = v;
          }
        }
      } catch (err) { console.warn('profile load', err); }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = readForm(form);
      if (!data.company_name?.trim()) return alert('Название обязательно');
      statusEl.textContent = 'Сохраняем…';
      try {
        await api('/profile/me', { method: 'PATCH', body: JSON.stringify(data) });
        statusEl.textContent = '✓ Сохранено';
        setTimeout(() => statusEl.textContent = '', 2500);
      } catch (err) {
        statusEl.textContent = 'Ошибка: ' + err.message;
      }
    });

    load();
  </script>
</body>

</html>
