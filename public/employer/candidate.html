<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ФСП · Карточка кандидата</title>
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/employer/employer.css" />
<link rel="stylesheet" href="/navigation_bar_styles.css" />
  <script src="/navigation_bar_script.js"></script>
</head>
<body data-navbar-state="employer">

<main class="emp-main">
    <div id="root"><div class="empty">Загружаем…</div></div>
</main>

<script type="module">
import { mountShell, api, escapeHtml } from '/employer/employer.js';
const user = await mountShell('candidate');
if (!user) throw new Error('auth');

const root = document.getElementById('root');
const id = new URLSearchParams(location.search).get('id');
if (!id) { root.innerHTML = '<div class="empty">Не указан id кандидата.</div>'; throw new Error('no id'); }

try {
  const { candidate } = await api('/matching/candidates/' + id);
  const fspBlock = candidate.fsp && candidate.fsp.length
    ? candidate.fsp.map(a => `
        <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line)">
          <div><b style="color:var(--accent)">${escapeHtml(a.place)}</b> — ${escapeHtml(a.event)}</div>
          <span style="color:var(--muted)">${escapeHtml(a.year)}</span>
        </div>`).join('')
    : `<div style="color:var(--muted); font-size:13px; padding:12px 0">
        История ФСП отсутствует. На категорию и подборку это <b>не влияет</b>.
      </div>`;

  root.innerHTML = `
    <div class="emp-head">
      <div>
        <h1>${escapeHtml(candidate.anon_id)}</h1>
        <p>${escapeHtml(candidate.specialization)} · ${escapeHtml(candidate.grade)} · тест ${candidate.test_score}%</p>
      </div>
      <a class="btn btn--primary" href="/employer/invite.html?candidate=${candidate.id}">Пригласить →</a>
    </div>

    <div class="card">
      <span class="card__label">Стек</span>
      ${(candidate.stacks || []).map(s => `<span class="tag tag--ok">${escapeHtml(s)}</span>`).join('')}
    </div>

    <div class="row2">
      <div class="card">
        <span class="card__label">Опыт</span>
        <div style="font-size:15px">${candidate.experience_years} лет</div>
        <span class="card__label" style="margin-top:14px">Софт-скиллы</span>
        <div style="font-size:14px; color:var(--muted)">${(candidate.soft_skills || []).join(' · ') || '—'}</div>
        <span class="card__label" style="margin-top:14px">О себе</span>
        <div style="font-size:14px; color:var(--muted); line-height:1.6">${escapeHtml(candidate.about)}</div>
      </div>
      <div class="card">
        <span class="card__label">Достижения ФСП</span>
        ${fspBlock}
      </div>
    </div>

    <div class="card" style="border-left:4px solid var(--accent-2)">
      <span class="card__label">Доступ к контактам</span>
      <div style="color:var(--muted); font-size:13px">
        🔒 Контакты раскроются только после того, как кандидат <b>примет</b> приглашение.
      </div>
    </div>
  `;
} catch (err) {
  root.innerHTML = `<div class="empty">Ошибка: ${escapeHtml(err.message)}</div>`;
}
</script>
</body>
</html>
