<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ФСП · Платформа ИТ-вакансий — профиль</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/navigation_bar_styles.css" />
    <link rel="stylesheet" href="/profile_styles.css" />
</head>

<body>
    <header>
        <h1>Профиль</h1>
    </header>

    <main>
        <form action="#" method="post" novalidate>

            <fieldset>
                <legend>Персональные данные</legend>

                <div class="profile-grid">
                    <p><span class="profile-label">Фамилия</span>
                        <span class="profile-value" id="pf-lastName">—</span>
                    </p>
                    <p><span class="profile-label">Имя</span>
                        <span class="profile-value" id="pf-firstName">—</span>
                    </p>
                    <p><span class="profile-label">Отчество</span>
                        <span class="profile-value" id="pf-middleName">—</span>
                    </p>
                    <p><span class="profile-label">Электронная почта</span>
                        <span class="profile-value"><a id="pf-email" href="#">—</a></span>
                    </p>
                    <p><span class="profile-label">Telegram</span>
                        <span class="profile-value"><a id="pf-telegram" href="#" target="_blank"
                                rel="noopener">—</a></span>
                    </p>
                    <p><span class="profile-label">Телефон</span>
                        <span class="profile-value"><a id="pf-phone" href="#">—</a></span>
                    </p>
                </div>
            </fieldset>

            <!-- ===== Категория и грейд ===== -->
            <fieldset>
                <legend>Категория и грейд</legend>

                <div class="category-card">
                    <div class="category-card__head">
                        <div>
                            <span class="profile-label">Текущая категория</span>
                            <span class="category-card__value" id="pf-category">—</span>
                        </div>
                        <div class="category-card__actions">
                            <button type="button" id="pf-test-single" class="category-btn" hidden>Пройти тест</button>
                            <button type="button" id="pf-test-higher" class="category-btn" hidden>↑ Выше</button>
                            <button type="button" id="pf-test-lower"  class="category-btn" hidden>↓ Ниже</button>
                        </div>
                    </div>
                </div>

                <span class="profile-label" style="margin-top:18px">История попыток</span>
                <div id="pf-history" class="history"></div>
            </fieldset>

            <fieldset>
                <legend>роли</legend>
                <ul class="badge-list" id="pf-roles"></ul>
            </fieldset>

            <fieldset>
                <legend>Стеки и технологии</legend>
                <ul class="badge-list" id="pf-stacks"></ul>
            </fieldset>

            <fieldset>
                <legend>Опыт</legend>
                <p><span class="profile-label">Стаж</span>
                    <span class="profile-value" id="pf-experience">—</span>
                </p>
                <p><span class="profile-label">О себе</span>
                    <span class="profile-value profile-value--multiline" id="pf-about">—</span>
                </p>
            </fieldset><br>

            <p class="profile-actions">
                <a class="profile-btn profile-btn--ghost" href="/profile_editing.html" role="button">Редактировать</a>
                <button type="button" id="exportPdf" class="profile-btn profile-btn--primary">Экспорт в PDF</button>
            </p>
        </form>
    </main>

    <footer class="site-footer">
        <p><small>ФСП · Платформа ИТ-вакансий</small></p>
    </footer>

    <script src="/navigation_bar_script.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/profile_script.js" defer></script>
</body>

</html>
