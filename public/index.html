<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ФСП · Платформа ИТ-вакансий — Вход</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/index_styles.css" />
</head>

<body>
  <div class="layout">
    <main class="panel">
      <div class="panel__inner">
        <h2 class="panel__title">Вход в личный кабинет</h2>
        <p class="panel__hint">Войдите по&nbsp;e&#8209;mail или через ФСП&nbsp;ID.</p>

        <form class="form" id="login-form" novalidate>
          <label class="field">
            <span class="field__label">E-mail</span>
            <input class="field__input" type="email" name="email" placeholder="you@example.com" autocomplete="email"
              required />
          </label>

          <label class="field">
            <span class="field__label">Пароль</span>
            <input class="field__input" type="password" name="password" placeholder="••••••••"
              autocomplete="current-password" required />
          </label>

          <div class="form__row">
            <label class="check">
              <input type="checkbox" name="remember" />
              <span>Запомнить меня</span>
            </label>
            <a class="link" href="#" data-stub>Забыли пароль?</a>
          </div>

          <button class="btn btn--primary" type="submit">Войти</button>
        </form>

        <div class="divider"><span>или</span></div>

        <button class="btn btn--ghost" id="fsp-id-btn" type="button">
          <span class="fsp-dot" aria-hidden="true"></span>
          Войти через ФСП&nbsp;ID
        </button>

        <p class="panel__foot">
          Нет аккаунта? <a class="link" href="/register.html">Зарегистрироваться</a>
        </p>

        <p class="legal">
          Продолжая, вы соглашаетесь с обработкой персональных данных
          в соответствии с ФЗ&nbsp;№&nbsp;152&#8209;ФЗ.
        </p>
        <p class="legal" style="text-align:center; margin-top:12px;">
          © ФСП, 2026 · прототип
        </p>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/login.js"></script>
</body>

</html>
